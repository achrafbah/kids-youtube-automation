name: "Manual Shorts Generator (Tales of Wonder)"

on:
  workflow_dispatch:
    inputs:
      count:
        description: 'عدد الفيديوهات المراد توليدها (Number of Shorts)'
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '5'
      privacy_status:
        description: 'حالة النشر في يوتيوب (Privacy Status)'
        required: true
        default: 'private'
        type: choice
        options:
          - private
          - public
      force:
        description: 'تجاوز فترات الانتظار وجدول النشر (Force bypass spacing guard)'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  manual_generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 🎥 Install FFmpeg & System Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-dejavu-core

      - name: 📦 Install Python Dependencies & Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 🚀 Run Manual Episode Generation Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          TIKTOK_SESSION_JSON: ${{ secrets.TIKTOK_SESSION_JSON }}
          TIKTOK_TOKEN_JSON: ${{ secrets.TIKTOK_TOKEN_JSON }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          YOUTUBE_PRIVACY_STATUS: ${{ github.event.inputs.privacy_status }}
          GENERATE_COUNT: ${{ github.event.inputs.count }}
          FORCE_RUN: ${{ github.event.inputs.force }}
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/generate_daily_episode.py

      - name: 🔄 Commit & Push Updated Topics History
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/topics_history.json data/tiktok_upload_history.json data/video_analytics_cache.json data/learned_patterns.json
          git diff --staged --quiet || (git commit -m "chore(history): auto-record manual shorts generation [skip ci]" && git push)

      - name: 📤 Upload Generated Video Artifact (Backup)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-shorts-output
          path: output/
          retention-days: 3
